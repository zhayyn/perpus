version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: perpustakaan_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - perpustakaan_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: perpustakaan_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - perpustakaan_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: perpustakaan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: perpustakaan
      MYSQL_USER: perpustakaan_user
      MYSQL_PASSWORD: perpustakaan_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - perpustakaan_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - perpustakaan_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      timeout: 20s
      retries: 10
      interval: 5s

  redis:
    image: redis:7.2-alpine
    container_name: perpustakaan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - perpustakaan_redis_data:/data
    networks:
      - perpustakaan_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 3s

  mailpit:
    image: axllent/mailpit:latest
    container_name: perpustakaan_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - perpustakaan_network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: perpustakaan_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_secret
    networks:
      - perpustakaan_network
    depends_on:
      db:
        condition: service_healthy

networks:
  perpustakaan_network:
    driver: bridge

volumes:
  perpustakaan_db_data:
    driver: local
  perpustakaan_redis_data:
    driver: local
